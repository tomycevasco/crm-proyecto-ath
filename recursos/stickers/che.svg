<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" role="img" aria-label="¡Che!">
  <defs>
    <filter id="borde-che" x="-15%" y="-15%" width="130%" height="130%">
      <feMorphology in="SourceAlpha" operator="dilate" radius="7" result="gordo"/>
      <feOffset in="gordo" dy="4"/>
      <feGaussianBlur stdDeviation="3" result="difuso"/>
      <feFlood flood-color="#000" flood-opacity=".22"/>
      <feComposite in2="difuso" operator="in" result="sombra"/>
      <feFlood flood-color="#fff"/>
      <feComposite in2="gordo" operator="in" result="blanco"/>
      <feMerge><feMergeNode in="sombra"/><feMergeNode in="blanco"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <g filter="url(#borde-che)" stroke="#2b2420" stroke-width="5" stroke-linejoin="round" stroke-linecap="round">
      <path d="M38 30h124c12 0 20 8 20 20v68c0 12-8 20-20 20H96l-38 34 6-34H38c-12 0-20-8-20-20V50c0-12 8-20 20-20Z" fill="#2f6fe4"/>
      
  <text x="100" y="108" text-anchor="middle" font-family="'Arial Black', 'Segoe UI Black', Impact, system-ui, sans-serif" font-weight="900"
        font-size="56" textLength="136" lengthAdjust="spacingAndGlyphs"
        fill="#fff" stroke="#2b2420" stroke-width="7" stroke-linejoin="round"
        paint-order="stroke">¡CHE!</text>
  </g>
</svg>
