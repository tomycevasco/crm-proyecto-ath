<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" role="img" aria-label="¡Dale que va!">
  <defs>
    <filter id="borde-dale-que-va" x="-15%" y="-15%" width="130%" height="130%">
      <feMorphology in="SourceAlpha" operator="dilate" radius="7" result="gordo"/>
      <feOffset in="gordo" dy="4"/>
      <feGaussianBlur stdDeviation="3" result="difuso"/>
      <feFlood flood-color="#000" flood-opacity=".22"/>
      <feComposite in2="difuso" operator="in" result="sombra"/>
      <feFlood flood-color="#fff"/>
      <feComposite in2="gordo" operator="in" result="blanco"/>
      <feMerge><feMergeNode in="sombra"/><feMergeNode in="blanco"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <g filter="url(#borde-dale-que-va)" stroke="#2b2420" stroke-width="5" stroke-linejoin="round" stroke-linecap="round">
      <g transform="rotate(30 100 80)">
        <path d="M86 128q14 34 28 0Z" fill="#ffd23f"/>
        <path d="M92 128q8 18 16 0Z" fill="#f07a1a" stroke="none"/>
        <path d="M76 104 56 128l24-4M124 104l20 24-24-4" fill="#e5484d"/>
        <path d="M100 18c26 22 30 70 22 110H78c-8-40-4-88 22-110Z" fill="#fff"/>
        <circle cx="100" cy="66" r="12" fill="#2f6fe4"/>
        <path d="M100 128v-10" fill="none"/>
      </g>
      
  <text x="100" y="182" text-anchor="middle" font-family="'Arial Black', 'Segoe UI Black', Impact, system-ui, sans-serif" font-weight="900"
        font-size="26" textLength="180" lengthAdjust="spacingAndGlyphs"
        fill="#ffd23f" stroke="#2b2420" stroke-width="7" stroke-linejoin="round"
        paint-order="stroke">¡DALE QUE VA!</text>
  </g>
</svg>
